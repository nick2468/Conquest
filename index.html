<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Conquest</title>

    <!-- The colour iPadOS paints around the app. -->
    <meta name="theme-color" content="#1f3348" />

    <!--
      These two make iPadOS open the Home Screen icon as an app, with no
      browser bars. The apple- prefixed one is the original; the plain one
      is the standard that replaced it. Both are needed for now.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Conquest" />

    <!--
      What a link sharer shows when somebody pastes the address into
      LinkedIn, Slack or a message. Without these the link arrives as a bare
      line of text with an empty grey box. The address must be absolute,
      because the sharer is not reading the page from this site.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Conquest" />
    <meta
      property="og:description"
      content="A turn-based territory game for the iPad and the web. Three hand-drawn maps, eight computer opponents, and it plays with the network off."
    />
    <meta property="og:url" content="https://conquest.datacrafter.net/" />
    <meta
      property="og:image"
      content="https://conquest.datacrafter.net/icon-512.png"
    />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta name="twitter:card" content="summary" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
